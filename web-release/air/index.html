<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湿り空気計算</title><link rel="stylesheet" href="/assets/style.css"></head>
<body>
  <header><div class="container"><a href="/index.html">← 計算ツール一覧</a></div></header>
  <main class="container">
    <h1>湿り空気計算</h1><p class="lead">既知の2項目を選び、空気の状態値を計算します。</p>
    <div class="grid">
      <form id="air-form" class="card">
        <div class="field"><label for="mode">入力する項目</label><select id="mode" name="mode"><option value="ta-rh">乾球温度 ＋ 相対湿度</option><option value="ta-td">乾球温度 ＋ 露点温度</option><option value="ta-x">乾球温度 ＋ 絶対湿度</option><option value="rh-x">相対湿度 ＋ 絶対湿度</option><option value="rh-td">相対湿度 ＋ 露点温度</option></select></div>
        <div class="field" data-field="ta"><label for="ta">乾球温度（℃）</label><input id="ta" name="ta" type="number" min="-50" max="80" step="0.1" value="25"></div>
        <div class="field" data-field="rh"><label for="rh">相対湿度（%）</label><input id="rh" name="rh" type="number" min="0.1" max="100" step="0.1" value="50"></div>
        <div class="field hidden" data-field="td"><label for="td">露点温度（℃）</label><input id="td" name="td" type="number" min="-80" max="80" step="0.1" value="15" disabled></div>
        <div class="field hidden" data-field="x"><label for="x">絶対湿度（g/kg(DA)）</label><input id="x" name="x" type="number" min="0.01" max="100" step="0.01" value="10" disabled></div>
        <details class="field"><summary>詳細設定</summary><label for="pressure">大気圧（Pa）</label><input id="pressure" name="pressure" type="number" min="60000" max="120000" step="1" value="101325"></details>
        <button id="calculate" type="submit">計算する</button>
      </form>
      <section class="card result" aria-live="polite"><h2>計算結果</h2><p id="status" class="status">計算しています…</p><dl id="metrics" class="metrics" hidden><div><dt>乾球温度</dt><dd><span data-result="ta">—</span> ℃</dd></div><div><dt>相対湿度</dt><dd><span data-result="rh">—</span> %</dd></div><div><dt>露点温度</dt><dd><span data-result="td">—</span> ℃</dd></div><div><dt>絶対湿度</dt><dd><span data-result="x">—</span> g/kg(DA)</dd></div><div><dt>比エンタルピー</dt><dd><span data-result="h">—</span> kJ/kg(DA)</dd></div><div><dt>湿り空気密度</dt><dd><span data-result="rho">—</span> kg/m³</dd></div></dl></section>
    </div>
    <section class="card chart-card">
      <div class="chart-heading">
        <div><h2>湿り空気線図</h2><p class="lead">入力した気圧でh-x線図を描き、計算結果を状態点として表示します。</p></div>
        <button id="download-chart" type="button" disabled>SVGを保存</button>
      </div>
      <div class="chart-scroll"><svg id="psychrometric-chart" class="psychrometric-chart" role="img" aria-labelledby="chart-title chart-description"></svg></div>
      <p id="chart-status" class="status" aria-live="polite">計算後に状態点を表示します。</p>
      <p class="chart-source">描画ロジック: <a href="https://github.com/iguchi-lab/psychrometric-chart" target="_blank" rel="noopener noreferrer">iguchi-lab/psychrometric-chart</a> の計算式をブラウザ用SVGへ移植。</p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
